# Single source of truth for the experiment. Tier 1 = the minimum viable study.
# Change values here, not inside code, so both of us run identical settings.
seed: 0
cache_dir: results/raw/cache   # gitignored

task:
  name: scene_recognition
  dataset: indoor67          # MIT Indoor Scenes, 67 classes, research-use only
  data_dir: data/indoor67    # gitignored; see README Data section
  manifest: splits/indoor67_seed0.json   # committed; source of truth for items
  n_options: 5               # true room + 4 distractors, letters A to E
  distractor_mode: confusable  # random | mixed | confusable; chosen on the pilot (GPT-4o ~96% either way)
  n_pilot: 100               # disjoint set used only to sanity check difficulty
  n_calibration: 500
  n_test: 500

conformal:
  alpha: 0.10                # 90% coverage target
  score: lac                 # least ambiguous classifier: 1 - p(true option)

corruptions:                 # FROZEN list: 12 conditions. Severity = % of the family's maximum usable strength
  - name: gaussian_noise     # (standard scale, see src/corruptions.py): sigma 0.40 / 0.60 / 0.80
    severities: [50, 75, 100]
  - name: pixelate           # resolution kept 12.5% / 6.25%
    severities: [75, 100]
  - name: defocus_blur       # disk radius 10.5 / 14 px
    severities: [75, 100]
  - name: grayscale          # control: color loss alone
    severities: [100]
  - name: blur_gray          # defocus blur (radius 14) then grayscale
    severities: [100]
  - name: cutmix             # 30% of the frame from a different room; label stays the base room
    severities: [100]
  - name: mixup              # 40% blend with a different room; label stays the base room
    severities: [100]
  - name: fisheye            # barrel distortion, k = 4
    severities: [100]
# Mild levels (25, 50) exist in src/corruptions.py but are deliberately NOT run: the 12 conditions
# above are frozen and identical for every model, so models stay directly comparable.
# Screened and dropped, no longer in the code: patch, hfgrid, vignette, shuffle, contrast, fog. See
# results/pilot_screening.md and docs/dropped_corruptions.py. Do not add or remove conditions after
# looking at test-split results.

models:                      # Every model runs the same frozen 12 conditions above.
  - name: gpt-4o
    provider: openai
    image_detail: high       # fixed; blur effects would be hidden by 'low' downsampling
    jpeg_quality: 95         # same encoder for clean and corrupted images

  # Classical baseline. No API key and no letters to read: CLIP scores image-text similarity
  # and a softmax over the five offered rooms gives probabilities directly. Expected to be
  # far less confident than the VLMs, which should loosen the cut-off and finally produce
  # shortlists holding more than one option.
  - name: clip-vit-base-patch32
    provider: clip
    hf_id: openai/clip-vit-base-patch32
    prompt_template: "a photo of a {}"
    jpeg_quality: 95         # same encoder as the API models, so the codec is never a confound

  # Larger CLIP. Same architecture family, same scoring and same prompts as ViT-B/32, so accuracy is
  # close to the only thing that differs. If its clean accuracy lands above the 90% target, the
  # crossover rule predicts it abstains where ViT-B/32 widens.
  - name: clip-vit-large-patch14
    provider: clip
    hf_id: openai/clip-vit-large-patch14
    prompt_template: "a photo of a {}"
    jpeg_quality: 95

  # Gemini. Only the 2.x line returns logprobs; 3.x and later refuse the parameter outright and
  # therefore cannot be scored by first-token letter probability at all.
  - name: gemini-2.5-flash
    provider: gemini
    top_logprobs: 20
    jpeg_quality: 95

  # Ministral 3. Every size shares one frozen 410M vision encoder, so the sizes differ mainly in
  # language-model capacity: an accuracy ladder with the image pathway held constant. Run every
  # size at the SAME precision, or the ladder is confounded by quantisation.
  #
  # Use the -BF16 repos, not the plain Instruct ones. The plain ones ship FP8 weights, which
  # bitsandbytes cannot re-quantise, and which transformers dequantises to BF16 on load anyway,
  # so they cost the same memory with none of the 4-bit saving.
  - name: ministral-3-3b
    provider: local
    hf_id: mistralai/Ministral-3-3B-Instruct-2512-BF16
    load_in_4bit: true
    dtype: bfloat16
    jpeg_quality: 95

  - name: ministral-3-8b
    provider: local
    hf_id: mistralai/Ministral-3-8B-Instruct-2512-BF16
    load_in_4bit: true
    dtype: bfloat16
    jpeg_quality: 95
